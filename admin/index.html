<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tikky Admin - Feedback Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://europe-west1-tikky-nekki.cloudfunctions.net https://*.supabase.co wss://*.supabase.co https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data:;">

  <!-- CDN libs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js" integrity="sha384-eEu5CTj3qGvu9PdJuS+YlkNi7d2XxQROAFYOr59zgObtlcux1ae1Il3u7jvdCSWu" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js" integrity="sha512-jEnuDt6jfecCjthQAJ+ed0MTVA++5ZKmlUcmDGBv2vUI/REn6FuIdixLNnQT+vKusE2hhTk2is3cFvv5wA+Sgg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- CSS files -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Inline styles: login screen, layout details -->
  <style>
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-lg);
    }
    .login-container {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-logo {
      margin-bottom: var(--space-lg);
      display: flex;
      justify-content: center;
    }
    .login-logo img {
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 12px var(--shadow-ambient);
    }
    .login-title {
      font-size: var(--text-2xl);
      font-weight: var(--font-weight-bold);
      margin-bottom: var(--space-xs);
    }
    .login-subtitle {
      color: var(--text-secondary);
      margin-bottom: var(--space-xl);
      font-size: var(--text-md);
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }
    .login-btn {
      width: 100%;
      padding: var(--space-sm) var(--space-lg);
      font-size: var(--text-base);
    }
    .login-message {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      min-height: 20px;
    }
    .login-message.success { color: var(--success); }
    .login-message.error { color: var(--error); }
    .login-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-md);
      color: var(--text-secondary);
    }
    .login-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-md);
      color: var(--error);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border-subtle);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mobile menu button */
    .mobile-only { display: none; }
    @media (max-width: 768px) {
      .mobile-only { display: flex; }
    }

    /* Header layout */
    .header-title {
      font-size: var(--text-lg);
      font-weight: var(--font-weight-semibold);
      white-space: nowrap;
    }
    .header-spacer { flex: 1; }
    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    /* Sidebar layout details */
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-md);
      border-bottom: 1px solid var(--border-subtle);
    }
    .sidebar-logo { border-radius: var(--radius-sm); }
    .sidebar-title {
      font-weight: var(--font-weight-bold);
      font-size: var(--text-md);
    }
    .sidebar-nav {
      flex: 1;
      padding: var(--space-sm);
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
    }
    .sidebar-footer {
      padding: var(--space-sm) var(--space-md);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-user {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: var(--text-sm);
    }
    .sidebar-actions {
      display: flex;
      gap: var(--space-xs);
    }

    /* Toast container */
    .toast-container {
      position: fixed;
      bottom: var(--space-lg);
      right: var(--space-lg);
      display: flex;
      flex-direction: column-reverse;
      gap: var(--space-sm);
      z-index: var(--z-toast);
      pointer-events: none;
    }
  </style>
</head>
<body class="theme-light">

  <!-- ========== LOGIN SCREEN ========== -->
  <div id="login-screen" class="login-screen">
    <div class="login-container">
      <div class="login-logo">
        <img src="assets/tikky-logo.webp" alt="Tikky" width="64" height="64">
      </div>
      <h1 class="login-title">Tikky Admin</h1>
      <p class="login-subtitle">Panel de administraci&oacute;n de feedback</p>

      <div id="login-form" class="login-form">
        <div class="input-group">
          <label class="label" for="login-email">Correo electr&oacute;nico</label>
          <input type="email" id="login-email" class="input" placeholder="admin@tikky.app" autocomplete="email">
        </div>
        <button id="login-btn" class="btn btn-primary login-btn" type="button">
          Enviar enlace m&aacute;gico
        </button>
        <p id="login-message" class="login-message"></p>
      </div>

      <div id="login-loading" class="login-loading hidden">
        <div class="spinner"></div>
        <p>Verificando acceso...</p>
      </div>

      <div id="login-error" class="login-error hidden">
        <p id="login-error-text"></p>
        <button id="login-error-back-btn" class="btn btn-secondary">Volver</button>
      </div>
    </div>
  </div>

  <!-- ========== APP SHELL (hidden until authenticated) ========== -->
  <div id="app-shell" class="hidden">

    <!-- Sidebar overlay for mobile -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <img src="assets/tikky-logo.webp" alt="Tikky" class="sidebar-logo" width="32" height="32">
        <span class="sidebar-title">Tikky Admin</span>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Populated by sidebar.js -->
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user" id="sidebar-user">
          <!-- Populated by auth -->
        </div>
        <div class="sidebar-actions">
          <button id="theme-toggle" class="btn btn-icon btn-ghost" title="Cambiar tema">
            <svg id="theme-icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="theme-icon-dark" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <button id="logout-btn" class="btn btn-icon btn-ghost" title="Cerrar sesi&oacute;n">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Header -->
    <header id="header">
      <button id="mobile-menu-btn" class="btn btn-icon btn-ghost mobile-only">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <h2 id="header-title" class="header-title">Dashboard</h2>
      <div class="header-spacer"></div>
      <div id="header-actions" class="header-actions">
        <!-- Populated per route -->
      </div>
    </header>

    <!-- Main content area -->
    <main id="main-content">
      <!-- Populated by router/views -->
    </main>

  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- JS (minificado) -->
  <script src="admin.min.js" defer></script>
</body>
</html>
